include:
  - ../compose-notebook.yml 
services:
  redis:
    image: redis:8.10
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - Practice

  insight:
    image: redis/redisinsight:3.8
    ports:
      - "${REDISINSIGHT_PORT}:5540"
    depends_on:
      - redis
    networks:
      - Practice

networks:
  Practice:
    name: redis_network
